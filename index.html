<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貓巧可大冒險</title>
<style>
:root{--bg:#bfe9ff;--ink:#3b2f5c;--card:#fffaf0;--btn:#ff7eb6;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1840;--ink:#f4ecff;--card:#3a3470;--btn:#ff7eb6;--btnink:#2a1740}}
:root[data-theme="dark"]{--bg:#1b1840;--ink:#f4ecff;--card:#3a3470;--btn:#ff7eb6;--btnink:#2a1740}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:18px;box-shadow:0 6px 0 rgba(59,47,92,.25)}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#ov.hide{display:none}
.card{background:var(--card);color:var(--ink);border-radius:28px;padding:22px 24px;text-align:center;max-width:290px;box-shadow:0 8px 0 rgba(59,47,92,.3)}
.card h1{margin:0 0 6px;font-size:30px;letter-spacing:1px}
.card p{margin:6px 0;font-size:15px;line-height:1.6}
.card small{opacity:.7;font-size:12px}
.card button{margin-top:12px;font:inherit;font-size:20px;font-weight:700;border:0;border-radius:999px;padding:10px 34px;background:var(--btn);color:var(--btnink);box-shadow:0 5px 0 rgba(0,0,0,.25);cursor:pointer}
.card button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.card button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#df{display:flex;gap:6px;justify-content:center;margin-top:10px}#df button{font-size:15px;padding:6px 14px;margin:0;background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}#df button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas>
<div id="ov"><div class="card"><h1 id="t">貓巧可大冒險</h1><p id="m"></p><div id="df"><button data-d="easy">Easy</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Hard</button></div><button id="go">出發彩虹冒險</button><p><small>非官方同人小遊戲</small></p></div></div></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d'),wrap=document.getElementById('wrap');
const ov=document.getElementById('ov'),tt=document.getElementById('t'),mm=document.getElementById('m'),go=document.getElementById('go');
const W=360,H=640,TAU=Math.PI*2;
let sc=1;
function fit(){const d=Math.min(2,devicePixelRatio||1);sc=Math.min(wrap.clientWidth/W,wrap.clientHeight/H);

addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const WORLDS=[
 {n:'台灣',sky:['#8fd3ff','#ffe3f1'],f:['🧋','🍡','🍚'],b:'🍗',bn:'雞排大王'},
 {n:'日本',sky:['#9fe3d8','#e6fbf6'],f:['🍙','🍣','🍜'],b:'🍱',bn:'便當魔王'},
 {n:'義大利',sky:['#a6e3a1','#eefbe9'],f:['🍕','🧀','🍝'],b:'🍰',bn:'提拉米蘇王'},
 {n:'法國',sky:['#c9b5ff','#ffe9f7'],f:['🥐','🥖','🧁'],b:'🎂',bn:'千層蛋糕王'},
 {n:'墨西哥',sky:['#ffb184','#fff0c2'],f:['🌮','🌯','🌶️'],b:'🌵',bn:'仙人掌大廚'}];
{const J=[{f:['🍟','🥤','🍩'],b:'🍗',bn:'油炸雞排王'},{f:['🍬','🍭','🍪'],b:'🧁',bn:'糖果魔王'},{f:['🍕','🌭','🥓'],b:'🍔',bn:'起司漢堡王'},{f:['🍩','🧁','🍮'],b:'🎂',bn:'奶油蛋糕王'},{f:['🍿','🧃','🍟'],b:'🥤',bn:'含糖汽水王'}];WORLDS.forEach((w,i)=>{w.f=J[i].f;w.b=J[i].b;w.bn=J[i].bn})}
WORLDS.length=0;WORLDS.push(
{n:'紅色',c:'#e53935',sky:['#ffc2c2','#fff0f0'],f:['🍟','🌭','🍕'],b:'🍔',bn:'番茄醬魔王'},
{n:'橙色',c:'#fb8c00',sky:['#ffd9a8','#fff4e5'],f:['🍤','🍗','🥓'],b:'🍗',bn:'炸雞魔王'},
{n:'黃色',c:'#fdd835',sky:['#fff3a8','#fffbe0'],f:['🍿','🧀','🥨'],b:'🍟',bn:'薯條魔王'},
{n:'綠色',c:'#43a047',sky:['#c5eec8','#f0fbf1'],f:['🥤','🍬','🍭'],b:'🧃',bn:'汽水魔王'},
{n:'藍色',c:'#1e88e5',sky:['#b8dcff','#eaf4ff'],f:['🍦','🧁','🍨'],b:'🍧',bn:'冰淇淋魔王'},
{n:'靛色',c:'#5e35b1',sky:['#c9bff0','#f1eeff'],f:['🍪','🍫','🍰'],b:'🎂',bn:'蛋糕魔王'},
{n:'紫色',c:'#8e24aa',sky:['#e3b9f0','#f9eefc'],f:['🍩','🍬','🍮'],b:'🍭',bn:'棒棒糖魔王'});
const QS=['如果大家都說你是對的，你就一定是對的嗎？','你選的，是你喜歡的，還是別人喜歡的？','沒人聽見的聲音，算不算有聲音？','跑得比較快，一定比較厲害嗎？','今天的你，和昨天的你是同一個你嗎？'];
const WE={pierce:'🌶️',homing:'🧶',boom:'🍫'},WN={pierce:'辣椒穿透',homing:'毛線追蹤',boom:'巧克力爆炸'};
const DFS={easy:{n:'簡單',sp:.8,fi:.7,hp:.8,spw:1.25,dir:.6,mh:4,key:'qiaoke-best-easy'},normal:{n:'普通',sp:1,fi:1,hp:1,spw:1,dir:1,mh:3,key:'qiaoke-best'},hard:{n:'困難',sp:1.2,fi:1.3,hp:1.3,spw:.8,dir:1.5,mh:3,key:'qiaoke-best-hard'}};
var DF=DFS.normal;let best=0;
function loadBest(){best=0;try{best=+localStorage.getItem(DF.key)||0}catch(e){}}loadBest();
function menu(){mm.innerHTML='<b>🏆 歷史最高（'+DF.n+'）'+best+'</b><span style="display:block;text-align:left;margin-top:8px">1. 右下角滑動移動，自動射擊<br>2. 吃道具換子彈<br>3. 左下 💣 放大招<br>4. 打倒 7 關魔王就通關</span>'}
document.querySelectorAll('#df button').forEach(b=>b.onclick=()=>{DF=DFS[b.dataset.d];loadBest();document.querySelectorAll('#df button').forEach(x=>x.classList.toggle('on',x===b));if(S==='menu')menu()});
let S='menu',P,B,E,EB,IT,PT,CL=[],score,level,spawnT,nextBoss,boss,time=0,shake=0,wi=0,BN=null,qi=0;
for(let i=0;i<9;i++)CL.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.6,1.4),v:rnd(12,30)});
function reset(){P={x:W/2,y:H-110,tx:W/2,ty:H-110,hp:DF.mh,mh:DF.mh,inv:0,cl:0,pw:1,st:0,wp:'star',wt:0,bm:1,sd:0,fx:0};B=[];E=[];EB=[];IT=[];PT=[];score=0;level=1;spawnT=1;nextBoss=700;boss=null;wi=0;BN=null;bossWait=0;bossArrive=0;sT=0;combo=0;cT=0;hurt=0;PEND=[];elDone=0}
reset();
const keys={};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(S!=='play'&&(k==='enter'||k===' '))start();else if(S==='play'&&(k===' '||k==='b'))bomb();
 if(k.startsWith('arrow')||k===' ')e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let ptr=false;
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/sc,(e.clientY-r.top)/sc]}
let lx=0,ly=0;const SX=W-64,SY=H-76;let JX=0,JY=0,stk=-1,TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;var bossWait=0,bossArrive=0,sT=0,combo=0,cT=0,hurt=0,PEND=[],elDone=0;function mv(e){const[x,y]=pos(e);P.tx=x;P.ty=y}function js(e){const[x,y]=pos(e);let dx=(x-SX)/46,dy=(y-SY)/46;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}if(m<.12){dx=dy=0}JX=dx;JY=dy}
cv.addEventListener('pointerdown',e=>{if(S!=='play')return;const[x,y]=pos(e);if(Math.hypot(x-40,y-(H-44))<36){bomb();return}if(e.pointerType==='mouse'){mv(e);return}TOUCH=1;if(x>W*.35&&y>H*.5){stk=e.pointerId;lx=x;ly=y;cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(S!=='play')return;if(e.pointerType==='mouse')mv(e);else if(e.pointerId===stk){const[x,y]=pos(e);P.tx+=(x-lx)*1.8;P.ty+=(y-ly)*1.8;lx=x;ly=y}});
function pu(e){if(e.pointerId===stk){stk=-1;JX=JY=0}}addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
go.onclick=start;
function banner(a,b){BN={a,b,t:5}}
function start(){reset();S='play';ov.classList.add('hide');banner('Stage 1: Fast Food Gang','Here we go!')}
function over(){S='over';if(score>best){best=score;try{localStorage.setItem(DF.key,best)}catch(e){}}
 tt.textContent='哎呀，被垃圾食物打敗了！';mm.innerHTML='走到第 '+(wi+1)+' 關　得分 '+score+'<br>最高分 '+best;go.textContent='再玩一次';ov.classList.remove('hide')}
mm.innerHTML='右下角區域滑動手指來移動，貓巧可會自動射擊。電腦用滑鼠或方向鍵。<br>垃圾食物是壞蛋，有圓圈和名字的才是好道具。你有 3 條命。<br>左下 💣 或空白鍵放大招，清光彈幕。<br>吃道具換子彈：🌶️穿透 🧶追蹤 🍫爆炸'+(best?'<br>最高分 '+best:'');

function ebul(x,y,a,sp){if(EB.length<450)EB.push({x,y,vx:Math.cos(a)*sp*DF.sp,vy:Math.sin(a)*sp*DF.sp})}
function ring(x,y,n,sp,off){for(let i=0;i<n;i++)ebul(x,y,i/n*TAU+off,sp)}
function spawn(ty,x,y=-30){const e={x,x0:x,y,t:0,ty,fl:0,sh:rnd(1,2.5)};
 if(ty===0){e.hp=1;e.r=14;e.vy=95+level*6}
 if(ty===1){e.hp=2;e.r=15;e.vy=85+level*4}
 if(ty===2){e.hp=6;e.r=22;e.vy=55}
 if(ty===4){e.hp=2;e.r=12;e.vy=290}
 if(ty===5){e.hp=5;e.r=17;e.vy=70;e.sh=.8}
 if(ty===6){e.hp=22;e.r=26;e.vy=70;e.ph=rnd(0,6);e.sh=1.2}
 if(ty===3){e.hp=Math.round((60+level*12)*DF.hp*(1+wi*.02)*(1+(P.pw-1)*.12));e.mhp=e.hp;e.r=46;e.vy=0;e.x=W/2;e.sh=1.5;boss=e}if(ty!==3){e.hp=Math.max(1,Math.ceil(e.hp*DF.hp*(1+(P.pw-1)*.12)));e.mhp=e.hp}
 E.push(e)}
function inView(e){return e.ty===3?e.y>-10:(e.x>8&&e.x<W-8&&e.y>50&&e.y<H-8)}
function dirWave(){const r=Math.random(),s=Math.random()<.5?1:-1,sx=s>0?-30:W+30;
 if(r<.3){const y=rnd(100,300);for(let i=0;i<3;i++)PEND.push({t:.7+i*.35,ty:0,x:sx,y:y+i*26,vx:115*s,vy:30,ns:1})}
 else if(r<.55){for(let i=0;i<4;i++)PEND.push({t:.8+i*.3,ty:0,x:sx,y:-20,vx:95*s,vy:115,ns:1})}
 else if(r<.8){const x=rnd(70,W-70);for(let i=0;i<2;i++)PEND.push({t:1+i*.4,ty:1,x:x+(i?55:-55),y:H+30,vx:0,vy:-95,ns:1})}
 else PEND.push({t:.9,ty:2,x:sx,y:rnd(120,260),vx:75*s,vy:28,ns:1})}
function specialWave(){if(boss||bossArrive>0)return false;const r=Math.random();
 
 if(r<.2){for(let i=0;i<2;i++)PEND.push({t:.8+i*.3,ty:4,x:rnd(30,W-30),y:-30,vx:0,vy:290,ns:1});return true}
 if(r<.28){spawn(5,rnd(60,W-60));return true}
 return false}
function special(e,dt,a,sp){
 if(e.ty===4){e.y+=e.vy*dt;e.x=e.x0;if(!e.fired&&inView(e)&&e.y>150){e.fired=1;ebul(e.x,e.y,a,sp*1.3)}}
 else if(e.ty===5){if(e.t<6){if(e.y<130)e.y+=e.vy*dt;else e.x=e.x0+Math.sin(e.t*1.5)*50}else e.y+=140*dt;
  if(inView(e)){e.sh-=dt*DF.fi;if(e.sh<=0){e.sh=.28;ebul(e.x,e.y,a+(Math.random()-.5)*.25,sp*1.1)}}}
 else{if(!e.arr){e.y+=70*dt;if(e.y>=110)e.arr=1}else{const k=Math.min(1,dt*4);e.x+=(W/2+Math.sin(e.t*.7+e.ph)*120-e.x)*k;e.y+=(130+Math.sin(e.t*1.1)*35-e.y)*k}
  if(inView(e)){e.sh-=dt*DF.fi;if(e.sh<=0){e.sh=1.5;for(let i=-2;i<=2;i++)ebul(e.x,e.y,Math.PI/2+i*.3,sp*.95);hbul(e.x,e.y,a-.5,Math.min(sp*.8,150));hbul(e.x,e.y,a+.5,Math.min(sp*.8,150))}}}}
WORLDS[2].f[1]='🍔';
const POOL=['🍟','🍔','🍕','🌭','🍩','🍪','🍫','🍬','🍭','🧁','🍰','🍿','🥓','🍗','🍤','🍦','🍨','🥤'];
function extraFood(i){const w=WORLDS[Math.min(wi,WORLDS.length-1)],used=[...w.f,w.b],p=POOL.filter(x=>!used.includes(x));return p[i%p.length]}
function hbul(x,y,a,s){if(EB.length<450){const v=s*DF.sp;EB.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,h:1,l:5,s:v})}}
function orb(b){const sp=Math.hypot(b.vx,b.vy)||1,ux=b.vx/sp,uy=b.vy/sp;for(let i=3;i>=1;i--)dot(b.x-ux*i*7,b.y-uy*i*7,5-i,'rgba(0,229,255,.55)');const p=11+Math.sin(time*14)*2;cx.strokeStyle='#00e5ff';cx.lineWidth=3;cx.beginPath();cx.arc(b.x,b.y,p,0,TAU);cx.stroke();dot(b.x,b.y,8,'#16213e');dot(b.x,b.y,3,'#fff')}
function bladeUpd(dt){if(!(P.cl>0))return;P.cl-=dt;P.ba=(P.ba||0)+dt*5;for(const e of E)e.bt=Math.max(0,(e.bt||0)-dt);for(let i=0;i<3;i++){const a=P.ba+i*TAU/3,bx=P.x+Math.cos(a)*44,by=P.y+Math.sin(a)*44;for(const e of E){if(e.dead||!inView(e)||e.bt>0)continue;if(Math.hypot(e.x-bx,e.y-by)<e.r+26){dmg(e,2+(P.pw>=5?1:0));e.bt=.3;burst(bx,by,'#e8f1ff',5)}}}}
function drawBlades(){const b0=P.ba||0;cx.strokeStyle='rgba(76,195,255,.45)';cx.lineWidth=2;cx.beginPath();cx.arc(P.x,P.y,44,0,TAU);cx.stroke();if(P.cl<1.5&&Math.floor(time*10)%2)return;for(let i=0;i<3;i++){const a=b0+i*TAU/3;cx.save();cx.translate(P.x+Math.cos(a)*44,P.y+Math.sin(a)*44);cx.rotate(a+Math.PI/2);cx.fillStyle='#e8f1ff';cx.strokeStyle='#3b2f5c';cx.lineWidth=3;cx.beginPath();cx.moveTo(0,-28);cx.quadraticCurveTo(16,-4,3,28);cx.quadraticCurveTo(4,0,0,-28);cx.closePath();cx.stroke();cx.fill();cx.restore()}}
function marks(e){const x=e.x,y=e.y;
 if(e.ty===4){cx.strokeStyle='rgba(255,190,30,.85)';cx.lineWidth=3;cx.lineCap='round';for(const o of[-8,0,8]){cx.beginPath();cx.moveTo(x+o,y-16);cx.lineTo(x+o,y-40+Math.abs(o));cx.stroke()}cx.lineCap='butt'}
 else if(e.ty===5){cx.strokeStyle='#d62828';cx.lineWidth=3;cx.beginPath();cx.arc(x,y,e.r+6,0,TAU);cx.stroke();cx.fillStyle='#d62828';for(let i=0;i<8;i++){const a=i*TAU/8+e.t*2;cx.beginPath();cx.moveTo(x+Math.cos(a)*(e.r+4),y+Math.sin(a)*(e.r+4));cx.lineTo(x+Math.cos(a+.18)*(e.r+12),y+Math.sin(a+.18)*(e.r+12));cx.lineTo(x+Math.cos(a-.18)*(e.r+12),y+Math.sin(a-.18)*(e.r+12));cx.fill()}}
 else{const p=e.r+8+Math.sin(time*8)*3;cx.strokeStyle='#3b2f5c';cx.lineWidth=8;cx.beginPath();cx.arc(x,y,p,0,TAU);cx.stroke();cx.strokeStyle='#ffd23f';cx.lineWidth=4;cx.beginPath();cx.arc(x,y,p,0,TAU);cx.stroke();
  cx.fillStyle='rgba(59,47,92,.4)';cx.fillRect(x-26,y-e.r-22,52,7);cx.fillStyle='#e53935';cx.fillRect(x-26,y-e.r-22,52*Math.max(0,e.hp)/(e.mhp||e.hp),7);
  cx.font='700 11px sans-serif';cx.textAlign='center';cx.textBaseline='bottom';cx.lineWidth=3;cx.strokeStyle='#fff';cx.strokeText('ELITE',x,y-e.r-24);cx.fillStyle='#3b2f5c';cx.fillText('ELITE',x,y-e.r-24)}}
function wave(){if(specialWave())return;if(Math.random()<Math.min(.5*DF.dir,(.12+level*.025)*DF.dir)){dirWave();return}const r=Math.random();
 if(r<.28)spawn(0,rnd(30,W-30));
 else if(r<.5)for(let i=0;i<5;i++)spawn(0,30+i*75);
 else if(r<.72){const x=rnd(100,W-100);for(let i=-2;i<=2;i++)spawn(1,x+i*38,-30-Math.abs(i)*26)}
 else if(r<.88){spawn(2,90);spawn(2,W-90)}
 else{spawn(1,rnd(40,W-40));spawn(0,rnd(40,W-40));spawn(0,rnd(40,W-40))}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,.7),c:col})}}
function hit(){if(P.inv>0||P.sd>0)return;P.hp--;combo=0;hurt=1;shake=.4;burst(P.x,P.y,'#ff7eb6',20);if(P.hp<=0){burst(P.x,P.y,'#ffd36e',30);over();return}P.inv=2.5;P.pw=1;P.wp='star';P.cl=0;EB.length=0;P.x=P.tx=W/2;P.y=P.ty=H-110;toast('HP '+P.hp+' left',W/2,H-150)}
function drop(x,y){const r=Math.random()*100,k=r<30?'s':r<55?'w':r<70?'h':r<85?'b':r<93?'d':'c',it={x,y,k};if(k==='w')it.wk=['pierce','homing','boom'][Math.random()*3|0];IT.push(it)}
function kill(e){combo++;cT=2;score+=Math.round((e.ty===3?400:e.ty===6?150:e.ty===5?40:e.ty===4?30:e.ty===2?50:e.ty===1?25:10)*(1+Math.min(20,combo)*.1));burst(e.x,e.y,e.ty===3?'#ffd36e':'#fff',e.ty===3?40:12);
 if(e.ty===3){boss=null;EB.length=0;if(!hurt){score+=1000;toast('No damage! +1000 pts',W/2,H-200)}hurt=0;wi++;if(wi>=WORLDS.length){win();return}sT=0;elDone=0;const w=WORLDS[wi%WORLDS.length];banner('Stage '+(wi+1)+': '+w.fam,'Think: '+QS[qi++%QS.length]);drop(e.x-24,e.y);drop(e.x+24,e.y);IT.push({x:e.x,y:e.y,k:'h'},{x:e.x,y:e.y-34,k:'l'})}
